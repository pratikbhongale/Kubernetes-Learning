apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-deployment-flask
spec:
  replicas: 2
  selector:
    matchLabels:
      app: py-flask
  template:
    metadata:
      labels:
        app: py-flask
    spec:
      containers:
      - name: python
        image: tiangolo/uwsgi-nginx-flask:python3.11
        ports:
        - containerPort: 80
