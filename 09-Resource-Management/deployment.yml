apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-resource
  namespace: demo-resource
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx
          resources:
            requests:
              cpu: "100m"
              memory: "1Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
